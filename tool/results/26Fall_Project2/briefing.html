<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artifact Disagreement Scorer · First Look</title>
<style>

:root{
  --bg:#0A0F1C; --bg2:#0D1424; --panel:#111A2E; --panel2:#16223A; --line:#23314E; --line2:#2E3F62;
  --text:#E5ECF6; --muted:#8B9BB7; --dim:#5B6B88;
  --accent:#22D3EE; --accent-ink:#67E8F9; --accent-soft:rgba(34,211,238,.12);
  --accent2:#A78BFA; --accent2-soft:rgba(167,139,250,.14);
  --hot:#FB7185; --hot-soft:rgba(251,113,133,.14); --warn:#FBBF24; --warn-soft:rgba(251,191,36,.14);
  --ok:#34D399; --ok-soft:rgba(52,211,153,.13); --minor:#64748B; --minor-soft:rgba(100,116,139,.18);
  --f1:#22D3EE; --f2:#A78BFA; --f3:#FBBF24; --f4:#34D399; --f5:#F472B6; --f6:#60A5FA; --f7:#FB923C; --f8:#4ADE80;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif;
  --mono:"Cascadia Code","JetBrains Mono","SF Mono",Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F3F6FB; --bg2:#EAF0F8; --panel:#FFFFFF; --panel2:#F5F8FC; --line:#D9E1EC; --line2:#C5D1E2;
  --text:#0F172A; --muted:#475569; --dim:#64748B;
  --accent:#0891B2; --accent-ink:#0E7490; --accent-soft:rgba(8,145,178,.10);
  --accent2:#7C3AED; --accent2-soft:rgba(124,58,237,.10);
  --hot:#E11D48; --hot-soft:rgba(225,29,72,.10); --warn:#B45309; --warn-soft:rgba(180,83,9,.10);
  --ok:#047857; --ok-soft:rgba(4,120,87,.10); --minor:#64748B; --minor-soft:rgba(100,116,139,.12);
  --f1:#0891B2; --f2:#7C3AED; --f3:#B45309; --f4:#047857; --f5:#DB2777; --f6:#2563EB; --f7:#C2410C; --f8:#15803D;
  --shadow:0 8px 24px rgba(15,23,42,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--ui);min-height:100vh;
  background-image:linear-gradient(var(--bg2) 1px,transparent 1px),linear-gradient(90deg,var(--bg2) 1px,transparent 1px);
  background-size:32px 32px;background-attachment:fixed}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono,code,kbd{font-family:var(--mono)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- header and tabs ---- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:54px}
.brand{display:flex;align-items:center;gap:9px;font:700 14px var(--mono);letter-spacing:.06em;color:var(--accent);white-space:nowrap}
.brand .nm{display:grid;line-height:1.15}
.brand .nm small{font:600 10px var(--mono);letter-spacing:.14em;color:var(--accent2)}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.case{display:flex;gap:8px;align-items:center;min-width:0;color:var(--muted);font-size:13px}
.case b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);
  font:600 12px var(--mono);color:var(--muted);white-space:nowrap;background:var(--panel)}
.pill.acc{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line2);background:var(--panel);color:var(--muted);border-radius:8px;height:32px;min-width:32px;
  display:inline-grid;place-items:center;cursor:pointer;padding:0 8px;font:600 12px var(--ui)}
.iconbtn:hover{color:var(--text);border-color:var(--accent)}
.tabs{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent);position:sticky;top:54px;z-index:19;backdrop-filter:blur(8px)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:8px;padding:12px 14px 11px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;
  border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.tab .n{font:600 11px var(--mono);padding:0 6px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.tab[aria-selected="true"] .n{background:var(--accent-soft);color:var(--accent-ink)}
.tab kbd{font-size:10px;color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:0 4px}
@media (max-width:760px){.tab kbd{display:none}.case .hide-s{display:none}}
@media (max-width:620px){.top .wrap{gap:8px}.case b{display:none}.brand{font-size:11px;letter-spacing:.02em;white-space:normal}.case{overflow:hidden}}
@media (max-width:420px){.case{display:none}}

/* ---- panels ---- */
main{padding:22px 0 60px}
.panel{display:none;animation:enter .35s ease both}
.panel.on{display:block}
.panel.on.from-r{animation-name:enterR}.panel.on.from-l{animation-name:enterL}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes enterR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes enterL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
/* ---- navigation aids ---- */
[data-nav]{cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.card[data-nav]:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft),var(--shadow);transform:translateY(-2px)}
.card[data-nav] .go{position:absolute;top:12px;right:12px;font:700 11px var(--mono);color:var(--dim);opacity:0;transition:opacity .15s,transform .15s}
.card[data-nav]:hover .go{opacity:1;transform:translateX(2px);color:var(--accent-ink)}
.ghost{position:fixed;z-index:60;pointer-events:none;border:2px solid var(--accent);border-radius:12px;background:var(--accent-soft);
  box-shadow:0 0 24px var(--accent);transition:all .45s cubic-bezier(.6,0,.2,1)}
.tab.ping{animation:ping .7s ease}
@keyframes ping{30%{background:var(--accent-soft);box-shadow:0 0 18px var(--accent-soft)}}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 2px var(--accent),0 0 26px var(--accent-soft)}100%{box-shadow:none}}
#backbtn{position:fixed;left:18px;bottom:18px;z-index:30;display:none;align-items:center;gap:8px;border:1px solid var(--accent);
  background:var(--panel);color:var(--accent-ink);border-radius:999px;padding:8px 14px;font:600 13px var(--ui);cursor:pointer;box-shadow:var(--shadow)}
#backbtn.on{display:inline-flex;animation:enter .3s ease}
#progress{position:fixed;left:0;top:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));z-index:40;width:0}
#keyhelp{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:none;place-items:center}
#keyhelp.on{display:grid}
#keyhelp .card{width:min(420px,92vw)}
#keyhelp kbd{display:inline-block;min-width:22px;text-align:center;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;margin-right:8px;color:var(--accent-ink)}
#keyhelp div.k{padding:5px 0;color:var(--muted);font-size:14px}
.filterbar{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;margin-bottom:12px;border:1px dashed var(--accent);border-radius:10px;
  background:var(--accent-soft);font-size:13px;color:var(--accent-ink)}
.filterbar.on{display:flex;animation:enter .3s ease}
.filterbar button{border:0;background:none;color:var(--accent-ink);font:700 13px var(--ui);cursor:pointer;text-decoration:underline}
.credit{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;color:var(--muted)}
.credit b{color:var(--accent-ink);font-family:var(--mono);letter-spacing:.04em}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h2{font-size:22px}
.ph .sub{color:var(--muted);font-size:14px;margin-top:3px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:26px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;position:relative}
.card h3{font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.kpi .v{font:700 34px/1 var(--mono);letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-size:13px;margin-top:6px}
.kpi.hot .v{color:var(--hot)}.kpi.acc .v{color:var(--accent)}.kpi.ok .v{color:var(--ok)}.kpi.warn .v{color:var(--warn)}
.kpi::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;border-radius:2px;background:var(--line)}
.kpi.hot::after{background:var(--hot)}.kpi.acc::after{background:var(--accent)}.kpi.ok::after{background:var(--ok)}.kpi.warn::after{background:var(--warn)}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.note{font-size:13px;color:var(--muted)}

/* ---- badges, chips, bars ---- */
.badge{display:inline-flex;align-items:center;gap:5px;font:700 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;white-space:nowrap}
.badge.hot{background:var(--hot-soft);color:var(--hot)}.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.minor{background:var(--minor-soft);color:var(--muted)}.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.acc{background:var(--accent-soft);color:var(--accent-ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--ui);padding:3px 8px;border-radius:999px;border:1px solid var(--line2);
  color:var(--muted);background:var(--panel2);white-space:nowrap}
.chip b{font:700 11px var(--mono);color:var(--accent-ink)}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar.hot>i{background:var(--hot)}.bar.warn>i{background:var(--warn)}.bar.minor>i{background:var(--minor)}.bar.ok>i{background:var(--ok)}

/* ---- tables ---- */
table.t{border-collapse:collapse;width:100%;font-size:14px}
.t th,.t td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.t th{color:var(--dim);font:700 11px var(--ui);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.t tbody tr:hover td{background:var(--panel2)}
.t td.num,.t th.num{text-align:right;font-family:var(--mono)}
.scroll-x{overflow-x:auto}

/* ---- expanding rows (accordion) ---- */
.acc-item{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px;overflow:hidden;transition:border-color .2s}
.acc-item:hover{border-color:var(--line2)}
.acc-item.open{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.acc-head{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left}
.acc-head .chev{transition:transform .25s;color:var(--dim)}
.acc-item.open .acc-head .chev{transform:rotate(90deg);color:var(--accent)}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.acc-item.open>.acc-body{grid-template-rows:1fr}
.acc-body>div{overflow:hidden}
.acc-inner{padding:2px 16px 16px;border-top:1px dashed var(--line)}
details.more{margin-top:10px}
details.more>summary{cursor:pointer;color:var(--accent-ink);font-size:13px;font-weight:600;list-style:none;display:inline-flex;align-items:center;gap:6px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸";transition:transform .2s;display:inline-block}
details.more[open]>summary::before{transform:rotate(90deg)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px;margin-top:8px}
.kv dt{color:var(--dim)}.kv dd{margin:0;font-family:var(--mono);overflow-wrap:anywhere}

/* ---- tooltip ---- */
#tip{position:fixed;z-index:50;pointer-events:none;max-width:320px;background:var(--panel);border:1px solid var(--accent);border-radius:8px;
  padding:8px 10px;font-size:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.on{opacity:1;transform:none}
#tip b{color:var(--accent-ink)}

/* ---- inputs ---- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:0 10px;height:36px;min-width:220px;flex:1;max-width:380px}
.search input{border:0;background:none;color:var(--text);font:14px var(--ui);outline:none;width:100%}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--muted);font:600 13px var(--ui);padding:0 12px;height:34px;cursor:pointer;border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}

footer.foot{border-top:1px solid var(--line);color:var(--dim);font-size:12px;padding:16px 0 30px;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{
  :root{--bg:#fff;--bg2:#fff;--panel:#fff;--panel2:#f4f6f9;--line:#d6dde8;--text:#000;--muted:#333;--dim:#555;color-scheme:light}
  body{background:#fff}.top,.tabs,.toolbar,.iconbtn{display:none!important}
  .panel{display:block!important;break-before:page}#backbtn,#progress,.ghost{display:none!important}.acc-body{grid-template-rows:1fr!important}
}

/* ---- first-look report ---- */
.lead-row{display:grid;grid-template-columns:44px 92px minmax(0,1fr) auto auto 18px;align-items:center;gap:12px;width:100%}
.rank{font:700 13px var(--mono);color:var(--dim)}
.score{display:grid;gap:4px}
.score .v{font:700 16px/1 var(--mono)}
.score .v small{font-size:11px;color:var(--dim);font-weight:600}
.fname{min-width:0}
.fname b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fname span{display:block;font:12px var(--mono);color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cicons{display:flex;gap:4px}
.cic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)}
.cic .ico{width:15px;height:15px}
@media (max-width:760px){.lead-row{grid-template-columns:34px 70px minmax(0,1fr) 18px}.lead-row .cicons,.lead-row .badge{display:none}}
.why{display:grid;gap:8px;margin:14px 0 4px}
.why li{list-style:none;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.why ul{margin:0;padding:0}
.why .t{font-weight:650}
.why .s{color:var(--muted);font-size:14px}
.ev{margin-top:12px;display:grid;gap:12px}
.evcard{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel2)}
.evcard .cap{font:700 11px var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.bytes{display:flex;gap:4px;flex-wrap:wrap;font:600 13px var(--mono)}
.bytes span{padding:4px 6px;border-radius:5px;background:var(--panel);border:1px solid var(--line)}
.bytes span.sig{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.vs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.vs .ne{font:700 18px var(--mono);color:var(--hot)}
.fbar{display:flex;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--line2);margin:6px 0}
.fbar i{display:grid;place-items:center;font:600 11px var(--mono);color:#06121f;white-space:nowrap;overflow:hidden}
.fbar .a{background:var(--accent)}.fbar .b{background:var(--hot)}
mark{background:var(--hot-soft);color:var(--hot);border-radius:3px;padding:0 2px}
.ctx{font:13px var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;overflow-wrap:anywhere}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:8px 0}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.dots{position:relative;height:34px;border-bottom:1px solid var(--line2);margin:6px 4px 16px}
.dots i{position:absolute;bottom:-5px;width:10px;height:10px;border-radius:50%;background:var(--minor);transform:translateX(-50%)}
.dots i.me{background:var(--hot);width:14px;height:14px;bottom:-7px;box-shadow:0 0 0 4px var(--hot-soft)}
.tl{position:relative;height:46px;margin:6px 8px}
.tl .ax{position:absolute;left:0;right:0;top:22px;height:2px;background:var(--line2)}
.tl .m{position:absolute;top:12px;transform:translateX(-50%);text-align:center;font:11px var(--mono);color:var(--muted);white-space:nowrap}
.tl .m i{display:block;margin:0 auto 4px;width:12px;height:12px;border-radius:50%;background:var(--minor)}
.tl .m.me i{background:var(--hot);box-shadow:0 0 0 4px var(--hot-soft)}
.checks8{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:10px}
.c8{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;font:700 11px var(--mono);background:var(--panel)}
.c8 i{display:block;width:8px;height:8px;border-radius:50%;margin:0 auto 4px;background:var(--dim)}
.c8.fired{border-color:var(--hot);color:var(--hot)}.c8.fired i{background:var(--hot)}
.c8.clean i{background:var(--ok)}.c8.na{color:var(--dim)}
@media (max-width:620px){.checks8{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* overview */
.funnel{display:grid;gap:10px}
.frow .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
.frow .lab b{font:700 14px var(--mono);color:var(--text)}
.mini{display:grid;grid-template-columns:34px 52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-radius:8px;cursor:pointer}
.mini:hover{background:var(--panel2)}
.ring{width:44px;height:44px}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--panel2)}
.ring .fg{stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring text{font:700 13px var(--mono);fill:var(--text)}
.cbar{display:grid;grid-template-columns:30px minmax(0,1fr) 54px;gap:10px;align-items:center;padding:6px;border-radius:8px;cursor:pointer}
.cbar:hover{background:var(--panel2)}
.cbar .nm{font-size:13px}
/* drive */
.hex{font:13px/1.9 var(--mono);overflow-x:auto;position:relative}
.hrow{display:flex;gap:14px;white-space:nowrap}
.hrow .o{color:var(--dim)}
.hrow .b{display:flex;gap:5px}
.hrow .b i{font-style:normal;padding:0 2px;border-radius:3px;cursor:default;transition:background .15s,color .15s}
.hrow .a{color:var(--dim);letter-spacing:.04em}
.hrow .a s{text-decoration:none;border-radius:2px}

    '<div class="lay"><div class="lbl"><span>IMAGE FILE · '+size(IM.bytes)+'</span><span>byte 0 → '+fmt(IM.bytes)+'</span></div><div class="segs">'+imgSegs+'</div>'+
    '<div class="zoom" style="--z1:'+z1+'%;--z2:100%"></div>'+
    '<div class="lbl"><span>INSIDE THE VOLUME'+(schematic?' · not to scale':'')+'</span><span>'+fmt(total)+' sectors</span></div><div class="segs" id="regs">'+regSegs+'</div>'+regLegend+
    '<div class="laydetail" id="regd">Hover or tap a part of the drive to see where it is and how the boot sector tells the computer.</div></div></div>';

  // --- picture 2: sectors make a cluster ---
  const n=Math.min(spc||1,16),cl=(spc||1)*bps;
  const clusterPic='<div class="card"><h3>How the drive counts space</h3><div class="clwrap" style="width:'+Math.min(100,n*7)+'%"><div class="sectors">'+[...Array(n).keys()].map(k=>'<i style="animation-delay:'+(k*60)+'ms" data-tip="sector '+(k+1)+': '+fmt(bps)+' bytes">'+fmt(bps)+'</i>').join("")+'</div>'+((spc||1)>16?'<div class="mono dim" style="font-size:11px">… '+spc+' sectors in all</div>':"")+
    '<div class="brace"></div></div>'+
    '<div class="eq">'+fmt(bps)+' bytes <span>×</span> '+fmt(spc)+' sectors <span>=</span> '+fmt(cl)+' bytes</div>'+
    '<div class="note" style="margin-top:6px">A <b>sector</b> is the smallest piece the disk reads. Files are stored in <b>clusters</b> of '+fmt(spc)+' sector'+(spc===1?"":"s")+', so even a 1-byte file takes '+size(cl)+'. '+
    'This volume has about '+fmt(Math.floor((IM.volume_size||0)/Math.max(1,cl)))+' clusters.</div></div>';

  $("#p-drive").innerHTML='<div class="ph"><div><h2>Drive</h2><div class="sub">What the drive says about itself. Hover a byte, a field or a part of the map.</div></div></div>'+
   '<div class="grid" style="grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start">'+
    '<div class="grid"><div class="card"><h3>Start of the drive · boot sector</h3><div class="hex" id="hexv">'+hexHtml+'</div>'+
      (B.length<512?'<div class="note" style="margin-top:8px">This run kept the first '+B.length+' bytes; newer runs keep the whole 512-byte boot sector.</div>':"")+
      '<div class="note" style="margin-top:8px">Numbers are stored with their bytes in reverse order (“little-endian”); hover a field to see it read.</div></div>'+
      layout+'</div>'+
    '<div class="card"><h3>What the bytes mean</h3><div class="fields">'+F.map((f,i)=>'<div class="fld" data-f="'+i+'" style="--fc:'+col(i)+'" data-tip="<b>'+esc(f[2])+'</b><br>'+esc(f[3])+'<br><span class=mono>offset '+f[0]+(f[1]>1?"–"+(f[0]+f[1]-1):"")+'</span>'+esc(leStrip(f))+'"><i></i><div>'+esc(f[2])+'<div class="off">offset '+f[0]+'</div></div><span class="v">'+esc(f[4])+'</span></div>').join("")+'</div></div>'+
   '</div>'+
   '<div class="grid g2" style="margin-top:14px">'+clusterPic+
    '<div class="card"><h3>Volume</h3><dl class="kv">'+facts.map(f=>'<dt>'+f[0]+'</dt><dd>'+esc(f[1])+'</dd>').join("")+'<dt>SHA-256</dt><dd>'+esc((IM.sha256||"").slice(0,24))+'… <button class="iconbtn" style="height:24px" data-copy="'+esc(IM.sha256)+'">copy</button></dd></dl>'+
     '<div class="note" style="margin-top:8px">The SHA-256 is the image file\'s fingerprint: if one byte changed, it would be completely different.</div></div>'+
   '</div>'+
   '<div class="grid g2" style="margin-top:14px">'+
    '<div class="card" id="kinds"><h3>Kinds of files</h3>'+types.map(t=>'<div style="margin-bottom:8px" class="frow" data-leads="q='+encodeURIComponent(t[0])+'" data-tip="Show leads of this kind"><div class="lab"><span class="mono">'+esc(t[0])+'</span><b>'+fmt(t[1])+'</b></div><div class="bar"><i data-w="'+(100*t[1]/tmax).toFixed(1)+'"></i></div></div>').join("")+
     '<div class="note">Identified from each file\'s first bytes, not its name. Click a kind to see its leads.</div></div>'+
    '<div class="card" id="clutter"><h3>Clutter set aside</h3>'+(noise.length?noise.map(t=>'<div style="margin-bottom:8px"><div class="frow"><div class="lab"><span>'+esc(t[0])+'</span><b>'+fmt(t[1])+'</b></div><div class="bar minor"><i data-w="'+(100*t[1]/nmax).toFixed(1)+'"></i></div></div></div>').join(""):'<div class="empty">None.</div>')+
     '<div class="note">Files made by computers on their own, rarely of interest. They are not checked.</div></div>'+
   '</div>';
  const hl=(fi,on)=>{$$('#p-drive [data-f="'+fi+'"]').forEach(e=>e.classList.toggle("hl",on));};
  // which boot-sector field tells the computer where each part of the map is
  const regField=r=>{const nm=r[0];if(fs==="NTFS")return nm.startsWith("File table")?fieldIdx(48):nm==="MFT mirror"?fieldIdx(56):nm==="Boot area"?fieldIdx(0):nm.startsWith("Backup")?fieldIdx(40):-1;
    return nm==="Reserved"?fieldIdx(14):nm.startsWith("FAT")?fieldIdx(fs==="FAT32"?36:22):nm==="Root folder"?fieldIdx(17):nm.startsWith("Files")?fieldIdx(13):-1;};
  const showReg=i=>{$$("#layout [data-reg]").forEach(x=>x.classList.toggle("hl",+x.dataset.reg===i));const fi=regField(regions[i]);
    $("#regd").innerHTML=regDetail(i)+(fi>=0?'<br><span class="note">Read from the boot sector field <b>'+esc(F[fi][2])+'</b> (offset '+F[fi][0]+'), highlighted above.</span>':"");return fi;};
  $("#p-drive").addEventListener("mouseover",e=>{$$("#p-drive .hl").forEach(x=>x.classList.remove("hl"));const g=e.target.closest("[data-reg]");
    if(g){const fi=showReg(+g.dataset.reg);if(fi>=0)hl(fi,true);return;}const t=e.target.closest("[data-f]");if(t)hl(t.dataset.f,true);});
  $("#p-drive").addEventListener("click",e=>{const g=e.target.closest("[data-reg]");if(g)showReg(+g.dataset.reg);});
  $("#p-drive").addEventListener("mouseleave",()=>$$("#p-drive .hl").forEach(x=>x.classList.remove("hl")));
  $$("#hexv i.f").forEach(b=>{const f=F[+b.dataset.f];b.dataset.tip="<b>"+esc(f[2])+"</b><br>"+esc(f[4])+"<br><span class=mono>byte "+b.dataset.o+"</span>"+leStrip(f);});
  document.addEventListener("ads:tab",e=>{if(e.detail==="drive")$$("#p-drive .sectors i").forEach(i=>{i.style.animation="none";void i.offsetWidth;i.style.animation="";});});
})();

// What each question does inside the tool, step by step, with a worked example.
const TECH={
 C1:{steps:["Read the first bytes of the file. Almost every format starts with a fixed pattern, its <b>signature</b> (also called a magic number). The tool knows 26 of them.",
   "Look up the name's extension (the part after the dot) in a table of 103 extensions that says what each one may contain: <code>.jpg</code> must be a JPEG, <code>.txt</code> must be text, <code>.docx</code> must be an Office file.",
   "If the bytes and the extension disagree, and the bytes are a strong signature (a picture, document, archive, program, database or audio file), the question finds something.",
   "Renaming a file changes only its name, never its bytes, so the signature gives the disguise away."],
  ex:()=>'<div class="cap">Example</div><div class="bytes"><span class="sig">FF</span><span class="sig">D8</span><span class="sig">FF</span><span>E0</span><span>00</span><span>10</span><span>4A</span><span>46</span></div>'+
   '<div class="vs"><span class="chip">Name: <b>holiday.txt</b>&nbsp;says text</span><span class="ne">≠</span><span class="chip">Bytes <b>FF D8 FF</b>&nbsp;say JPEG photo</span></div>'+
   '<dl class="sigs" style="margin-top:10px"><dt>FF D8 FF</dt><dd>JPEG photo</dd><dt>89 50 4E 47</dt><dd>PNG picture (“‰PNG”)</dd><dt>25 50 44 46 2D</dt><dd>PDF (“%PDF-”)</dd><dt>50 4B 03 04</dt><dd>ZIP, and Word/Excel 2007+ (“PK”)</dd>'+
   '<dt>D0 CF 11 E0</dt><dd>Word/Excel 97-2003</dd><dt>52 61 72 21</dt><dd>RAR archive (“Rar!”)</dd><dt>4D 5A</dt><dd>Windows program (“MZ”)</dd><dt>7F 45 4C 46</dt><dd>Linux program (“␡ELF”)</dd></dl>',
  limits:"Extensions not in the table, empty files and files with no strong signature are not judged. A file whose first bytes were edited as well would not be caught."},
 C2:{steps:["For JPEG, PNG, GIF, ZIP and PDF files the tool walks the format's own structure to find where the file really ends: a JPEG's end-of-image marker <code>FF D9</code>, a PNG's <code>IEND</code> chunk, a GIF's closing byte <code>3B</code>, a ZIP's end-of-directory record <code>PK 05 06</code>, a PDF's last <code>%%EOF</code>.",
   "It compares that end with the file's real size. Programs that open the file stop at the end marker, so anything after it is invisible to them.",
   "If 16 or more bytes follow and they are not just padding (zeros, FF or spaces), the question finds something.",
   "The extra bytes are then identified by their own signature (RAR, 7-Zip, ZIP, JPEG, PNG, PDF, Office or Windows program), and a hidden RAR's file names are listed."],
  ex:()=>'<div class="cap">Example: a photo with an archive glued on</div><div class="fbar"><i class="a" style="width:62%">JPEG … FF D9</i><i class="b" style="width:38%">52 61 72 21 = RAR</i></div>'+
   '<div class="legend"><span><i style="background:var(--accent)"></i>what a picture viewer shows</span><span><i style="background:var(--hot)"></i>what it never shows</span></div>',
  limits:"Short unrecognised tails on PDFs (under 4 KB) are normal and ignored. Formats without an end marker are not judged."},
 C3:{steps:["The tool reads each format's own “locked” flag rather than guessing from how random the bytes look.",
   "<b>Word, Excel, PowerPoint 2007+:</b> a locked file is stored inside an older container holding <code>EncryptionInfo</code> and <code>EncryptedPackage</code> streams. <b>Word 97-2003:</b> the encrypted bit (<code>0x0100</code>) in the document header. <b>Excel 97-2003:</b> a <code>FILEPASS</code> record near the start of the workbook.",
   "<b>ZIP:</b> bit 0 of each entry's flags. <b>PDF:</b> an <code>/Encrypt</code> entry. <b>RAR:</b> the password flag in each file header.",
   "Any of these means the file cannot be read without a password."],
  ex:()=>'<div class="cap">Example: a ZIP entry header</div><div class="bytes"><span>50</span><span>4B</span><span>03</span><span>04</span><span>14</span><span>00</span><span class="sig" data-tip="flags: bit 0 = 1 means encrypted">01</span><span>00</span></div><div class="note" style="margin-top:6px">The highlighted flag byte ends in 1: this entry is locked.</div>',
  limits:"Formats not listed are not judged. The tool never tries to open a locked file."},
 C4:{steps:["Search every file's raw bytes, programs included, for a phrase: a word like <code>password</code>, <code>pass</code>, <code>passcode</code>, <code>pwd</code>, <code>pin</code> or <code>secret</code>, then <code>is</code> or <code>was</code>, then the candidate.",
   "Keep the candidate only if it looks like a real password: at least 4 characters, not an everyday word (“incorrect”, “required”, “wrong” and about 40 more), and containing a digit, mixed capitals, or 12+ characters.",
   "Record up to five per file, with the 30 bytes before and 10 after so a person can read the sentence.",
   "Every key found is collected in the Keys &amp; Locks tab, next to the locked files it might open."],
  ex:()=>'<div class="cap">Example</div><div class="ctx">…note to self: the password is <mark>Tr0ub4dor</mark> for the zip…</div>'+
   '<div class="dec"><span class="y">Tr0ub4dor ✓ has a digit</span><span class="n">“incorrect” ✗ everyday word</span><span class="n">“abc” ✗ too short</span><span class="n">“secret” ✗ no digit or capitals</span></div>',
  limits:"Passwords written without such a phrase, or in a picture, are not found."},
 C5:{steps:["Group the files by folder (files inside an archive count as their own folder). A folder needs at least 5 files.",
   "<b>Only one of its kind:</b> the file is a personal type (photo, PDF, Office document, email, archive, database or audio) and no other file in its folder is that type.",
   "<b>Far bigger than its peers:</b> the file is a personal type, at least 3 others in the folder are the same type, and it is 10 or more times their middle (median) size.",
   "Either one means the file does not fit where it was put."],
  ex:()=>'<div class="cap">Example: a folder of program diagrams</div><div class="stack"><i style="width:70%;background:var(--f6)"></i><i style="width:24%;background:var(--f2)"></i><i style="width:6%;background:var(--hot)"></i></div>'+
   '<div class="legend"><span><i style="background:var(--f6)"></i>GIF diagrams (35)</span><span><i style="background:var(--f2)"></i>web pages (12)</span><span><i style="background:var(--hot)"></i>one JPEG photo</span></div>',
  limits:"Folders with fewer than 5 files are not judged, and neither are file types that are never personal (such as program code)."},
 C6:{steps:["First, collect every file name (like <code>logo.gif</code>) written anywhere inside the drive's text, web-page, XML and PDF files.",
   "For each folder with at least 4 other files, count how many of those files are mentioned somewhere. If 60% or more are, the folder is “documented”.",
   "In a documented folder, a file whose name is never mentioned anywhere finds something.",
   "Files that came with a program usually appear in its guides; a file somebody added afterwards does not."],
  ex:()=>'<div class="cap">Example</div><div class="docmap"><div class="col"><span>readme.html</span><span class="mono dim" style="border:0;padding:0">mentions:</span><span class="ok">a.gif</span><span class="ok">b.gif</span><span class="ok">c.gif</span></div>'+
   '<div style="text-align:center;color:var(--dim)">→</div><div class="col"><span class="ok">a.gif ✓</span><span class="ok">b.gif ✓</span><span class="ok">c.gif ✓</span><span class="no">secret.jpg ✗</span></div></div>',
  limits:"Folders whose files are not usually mentioned, and files inside archives, are not judged."},
 C7:{steps:["Open each ZIP archive (but not Java and app packages such as <code>.jar</code> or <code>.apk</code>, which are software).",
   "Check every file inside as a file of its own: all the other questions run on archive members too.",
   "The archive finds something if any member is locked with a password, or is an email or a Word, Excel or other Office document.",
   "The member names are listed so a person can decide which to open first."],
  ex:()=>'<div class="cap">Example</div><span class="chip" style="margin:2px">'+SVG(CI.C3)+'mypuppy.jpg (photo, locked)</span><span class="chip" style="margin:2px">letter.docx (Office file)</span><span class="chip" style="margin:2px">notes.eml (email)</span>',
  limits:"RAR and 7-Zip archives are not opened (a RAR's names are read only when hidden behind another file, see C2)."},
 F1:{steps:["Count how many files share each exact last-written time, to the second.",
   "If one time is shared by at least 20% of the dated files, the drive has a <b>bulk copy</b>: a folder copied all at once gets one time.",
   "A file whose time is shared by fewer than 1% of files, and is not the bulk time, finds something: it was written separately, later or earlier.",
   "Files inside archives and files without a date are not judged."],
  ex:()=>'<div class="cap">Example</div><div class="tl"><div class="ax"></div><div class="m" style="left:22%"><i></i>bulk copy · 4,700 files</div><div class="m me" style="left:78%"><i></i>one file, 3 days later</div></div>',
  limits:"FAT drives store last-written times to the nearest 2 seconds in local time; a drive with no bulk-copy pattern is not judged."}
};
(function(){

  const maxW=Math.max(...RIDS.map(r=>R[r].weight));

     return '<div class="acc-item" style="margin:0" id="q-'+r+'"><button class="acc-head"><span class="cic">'+SVG(CI[r])+'</span>'+
     '<div style="flex:1;min-width:0"><b>'+r+' · '+esc(q.name)+'</b><div class="note">'+esc(q.question)+'</div></div><span class="chip"><b>'+fmt(q.violated)+'</b>&nbsp;files</span>'+chev+'</button>'+
     '<div class="acc-body"><div><div class="acc-inner"><p style="margin-top:10px">'+esc(q.why)+'</p>'+
     '<div class="cap" style="font:700 11px var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-top:14px">How the tool answers it</div>'+
     '<ol class="tech-steps">'+t.steps.map(x=>'<li><div>'+x+'</div></li>').join("")+'</ol>'+
     '<div class="exbox">'+t.ex()+'</div>'+
     (t.limits?'<div class="limits"><b>Not judged:</b> '+esc(t.limits)+'</div>':'')+
     '<div class="math"><b>On this drive:</b> could be asked of '+fmt(q.evaluable)+' files, found something in '+fmt(q.violated)+'.<br>'+
      'Weight = ln(1 / p), where p = ('+fmt(q.violated)+' + 0.5) / ('+fmt(C.examined)+' + 1) = '+q.p_r.toFixed(4)+', so weight = <b>'+q.weight.toFixed(2)+'</b>'+
      '<div class="wmeter">'+[...Array(10).keys()].map(k=>'<i class="'+(k<bars?"on":"")+'"></i>').join("")+'</div><span class="note">The rarer a clue on this drive, the more it counts.</span></div>'+
     (q.violated?'<div style="margin-top:10px"><button class="linkbtn" data-leads="c='+r+'">See the '+fmt(q.violated)+' file'+(q.violated===1?"":"s")+' it found ›</button></div>':'')+
     '</div></div></div></div>';}).join("")+'</div>'+
   '<div class="grid g2" style="margin-top:14px"><div class="card"><h3>The score</h3><p>Each file\'s score is the share of the questions that found something, with rare clues weighing more. Out of 100.</p>'+
     '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><span class="badge hot" data-leads="t=hot">Look first ≥ '+pct(T.strong)+'</span><span class="badge warn" data-leads="t=warn">Worth a look ≥ '+pct(T.moderate)+'</span><span class="badge minor" data-leads="t=minor">Minor &lt; '+pct(T.moderate)+'</span></div>'+
     '<details class="more"><summary>The formula</summary><p class="note" style="margin-top:6px">Score = Σ w·fired / Σ w over the questions that could be asked of the file, where each weight w = ln(1/p) and p is the share of examined files on this drive the question fires on. A question that cannot be asked of a file (for example C2 on a text file) is left out of both sums, so it neither raises nor lowers the score.</p></details></div>'+
   '<div class="card"><h3>Limits</h3><p>The tool points to files; it does not open locked files or answer the case questions. An examiner still reads each file.</p>'+
     '<details class="more"><summary>About the date checks</summary><p class="note" style="margin-top:6px">'+esc(D.not_applicable||"")+'</p></details></div></div>'+
   '<div class="card" style="margin-top:14px"><div class="credit" style="margin:0"><b>Artifact Disagreement Scorer</b><span>· Created by Captain Scott Russell for CPRE 5360</span></div></div>';
})();

/* ---------------- wiring ---------------- */
function openLead(path,from){
  const it=$$("#ll .acc-item").find(x=>x.dataset.path===path);if(!it)return;
  ADS_FLY(from,"leads",()=>{if(it.style.display==="none")ADS_LEADS("");it.classList.add("open");it.querySelector(".acc-head").setAttribute("aria-expanded","true");ADS_ANIMATE(it);ADS_FLASH(it);});
}
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"),lf=e.target.closest("[data-leads]"),tr=e.target.closest("#ab tr"),stp=e.target.closest("[data-step]");
  if(lf){e.preventDefault();const spec=lf.dataset.leads;ADS_FLY(lf,"leads",()=>ADS_LEADS(spec));return;}
  if(o){openLead(o.dataset.open,o);return;}
  if(tr&&detailed[tr.dataset.path]){openLead(tr.dataset.path,tr);return;}
  if(stp){const rows=$$("#ll .acc-item").filter(x=>x.style.display!=="none"),cur=stp.closest(".acc-item"),i=rows.indexOf(cur),n=rows[i+(+stp.dataset.step)];
    if(n){cur.classList.remove("open");n.classList.add("open");ADS_ANIMATE(n);n.scrollIntoView({behavior:"smooth",block:"start"});}}
});
document.addEventListener("ads:tab",e=>{$$("#p-"+e.detail+" .ring .fg").forEach(c=>{c.style.strokeDashoffset=c.getAttribute("stroke-dasharray");requestAnimationFrame(()=>requestAnimationFrame(()=>c.style.strokeDashoffset=c.dataset.off));});});
document.addEventListener("click",e=>{const h=e.target.closest(".acc-head");if(h)setTimeout(()=>ADS_ANIMATE(h.closest(".acc-item")),10);});
})();
</script>
<script>
(function(){
  const $=(s,r)=> (r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
  // theme toggle (remembered per viewer; works without storage too)
  const root=document.documentElement;
  try{const t=localStorage.getItem('ads-theme'); if(t) root.dataset.theme=t;}catch(e){}
  $$('[data-act="theme"]').forEach(b=>b.addEventListener('click',()=>{
    root.dataset.theme = root.dataset.theme==='light' ? 'dark' : 'light';
    try{localStorage.setItem('ads-theme',root.dataset.theme);}catch(e){}
  }));
  $$('[data-act="print"]').forEach(b=>b.addEventListener('click',()=>window.print()));
  // tabs: hash routing, number keys, arrow keys
  const tabs=$$('.tab[data-tab]'), names=tabs.map(t=>t.dataset.tab);
  let current=null;
  function show(name,push){
    if(!names.length) return;            // a page without tabs (the control panel)
    if(!names.includes(name)) name=names[0];
    const dir=current==null?"":names.indexOf(name)>names.indexOf(current)?"from-r":names.indexOf(name)<names.indexOf(current)?"from-l":"";
    $$('.panel').forEach(p=>p.classList.remove('from-r','from-l')); const pn=$('#p-'+name); if(pn&&dir) pn.classList.add(dir);
    if(current!==name&&!flying) back.classList.remove('on');
    current=name;
    tabs.forEach(t=>t.setAttribute('aria-selected', t.dataset.tab===name?'true':'false'));
    $$('.panel').forEach(p=>p.classList.toggle('on', p.id==='p-'+name));
    if(push!==false && location.hash!=='#'+name) history.pushState(null,'','#'+name);
    window.scrollTo({top:0});
    document.dispatchEvent(new CustomEvent('ads:tab',{detail:name}));
  }
  window.ADS_SHOW=show;
  // "fly" navigation: a glowing box travels from what was clicked to the tab it opens,
  // and a back button offers the way home.
  let flying=false;
  const back=document.createElement('button'); back.id='backbtn'; document.body.appendChild(back);
  let backTo=null;
  back.addEventListener('click',()=>{const b=backTo;back.classList.remove('on');if(b){show(b.tab);if(b.y!=null)setTimeout(()=>window.scrollTo({top:b.y,behavior:'smooth'}),50);}});
  function fly(from,name,after){
    const tab=tabs.find(t=>t.dataset.tab===name);
    const ct=tabs.find(t=>t.dataset.tab===current), tn=ct&&[...ct.childNodes].find(n=>n.nodeType===3&&n.textContent.trim());
    const origin={tab:current,y:window.scrollY}, label=tn?tn.textContent.trim():'';
    const done=()=>{flying=true;show(name);flying=false;if(tab){tab.classList.remove('ping');void tab.offsetWidth;tab.classList.add('ping');}
      if(origin.tab&&origin.tab!==name){backTo=origin;back.innerHTML='&#8592; Back to '+label;back.classList.add('on');}
      if(after)setTimeout(after,60);};
    const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(!from||!tab||reduce||name===current){done();return;}
    const a=from.getBoundingClientRect(), b=tab.getBoundingClientRect(), g=document.createElement('div'); g.className='ghost';
    Object.assign(g.style,{left:a.left+'px',top:a.top+'px',width:a.width+'px',height:a.height+'px'}); document.body.appendChild(g);
    requestAnimationFrame(()=>requestAnimationFrame(()=>Object.assign(g.style,{left:b.left+'px',top:b.top+'px',width:b.width+'px',height:b.height+'px',opacity:'.4'})));
    setTimeout(()=>{g.remove();done();},430);
  }
  window.ADS_FLY=fly;
  // bring an element into view and make it glow briefly
  window.ADS_FLASH=el=>{if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');};
  // generic links: data-nav="tab" with optional data-target="#css-selector" to open and flash
  document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(!n)return;e.preventDefault();
    fly(n,n.dataset.nav,()=>{const t=n.dataset.target&&$(n.dataset.target);if(t){if(t.classList.contains('acc-item')&&!t.classList.contains('open')){t.classList.add('open');animate(t);}window.ADS_FLASH(t);}});});
  // keyboard help
  const kh=document.createElement('div'); kh.id='keyhelp';
  kh.innerHTML='<div class="card"><h3>Keyboard</h3><div class="k"><kbd>1</kbd>-<kbd>'+Math.max(1,names.length)+'</kbd> open a tab</div><div class="k"><kbd>&#8592;</kbd><kbd>&#8594;</kbd> previous / next tab</div>'+
    '<div class="k"><kbd>/</kbd> search this tab</div><div class="k"><kbd>j</kbd><kbd>k</kbd> next / previous row</div><div class="k"><kbd>Esc</kbd> close this</div><div class="k"><kbd>?</kbd> show this help</div></div>';
  document.body.appendChild(kh); kh.addEventListener('click',e=>{if(e.target===kh)kh.classList.remove('on');});
  // reading progress along the top edge
  const prog=document.createElement('div'); prog.id='progress'; document.body.appendChild(prog);
  addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-innerHeight;prog.style.width=(h>0?100*scrollY/h:0)+'%';},{passive:true});
  tabs.forEach(t=>t.addEventListener('click',e=>{e.preventDefault();show(t.dataset.tab);}));
  window.addEventListener('popstate',()=>show(location.hash.slice(1),false));
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){kh.classList.remove('on');const i=document.activeElement;if(i&&i.blur)i.blur();return;}
    if(e.target.closest('input,textarea')||e.ctrlKey||e.metaKey||e.altKey) return;
    if(e.key==='?'){kh.classList.toggle('on');return;}
    if(e.key==='/'){const q=$('.panel.on input');if(q){e.preventDefault();q.focus();}return;}
    if(e.key==='j'||e.key==='k'){const rows=$$('.panel.on .acc-item').filter(x=>x.offsetParent);if(!rows.length)return;
      let i=rows.findIndex(x=>x.classList.contains('open'));const n=e.key==='j'?Math.min(rows.length-1,i+1):Math.max(0,i-1);
      rows.forEach(x=>{x.classList.remove('open');const h=x.querySelector('.acc-head');if(h)h.setAttribute('aria-expanded','false');});
      rows[n].classList.add('open');animate(rows[n]);rows[n].scrollIntoView({behavior:'smooth',block:'center'});return;}
    const i=parseInt(e.key,10); if(i>=1&&i<=names.length){show(names[i-1]);return;}
    const cur=names.indexOf((tabs.find(t=>t.getAttribute('aria-selected')==='true')||tabs[0]||{}).dataset?.tab);
    if(e.key==='ArrowRight'&&cur<names.length-1) show(names[cur+1]);
    if(e.key==='ArrowLeft'&&cur>0) show(names[cur-1]);
  });
  // accordions
  document.addEventListener('click',e=>{
    const h=e.target.closest('.acc-head'); if(!h) return;
    const it=h.closest('.acc-item'); it.classList.toggle('open'); h.setAttribute('aria-expanded', it.classList.contains('open'));
  });
  // tooltip for anything with data-tip
  const tip=document.createElement('div'); tip.id='tip'; document.body.appendChild(tip);
  document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]'); if(!el){tip.classList.remove('on');return;}
    tip.innerHTML=el.dataset.tip; tip.classList.add('on');});
  document.addEventListener('mousemove',e=>{if(!tip.classList.contains('on'))return;
    const w=tip.offsetWidth,h=tip.offsetHeight; let x=e.clientX+14,y=e.clientY+16;
    if(x+w>innerWidth-8)x=e.clientX-w-14; if(y+h>innerHeight-8)y=e.clientY-h-16; tip.style.left=x+'px'; tip.style.top=y+'px';});
  // count-up numbers and growing bars when a panel is shown
  function animate(scope){
    $$('[data-count]',scope).forEach(el=>{const to=+el.dataset.count, t0=performance.now(), d=900;
      (function f(t){const k=Math.min(1,(t-t0)/d), v=Math.round(to*(1-Math.pow(1-k,3))); el.textContent=v.toLocaleString(); if(k<1)requestAnimationFrame(f);})(t0);});
    $$('.bar>i[data-w]',scope).forEach(i=>{i.style.width='0';requestAnimationFrame(()=>requestAnimationFrame(()=>i.style.width=i.dataset.w+'%'));});
  }
  window.ADS_ANIMATE=animate;
  document.addEventListener('ads:tab',e=>animate($('#p-'+e.detail)));
  // copy buttons
  document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]'); if(!b)return;
    const txt=b.dataset.copy; const done=()=>{const o=b.textContent;b.textContent='copied';setTimeout(()=>b.textContent=o,1200);};
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(done,done); else done();});
  window.addEventListener('DOMContentLoaded',()=>show(location.hash.slice(1)||names[0],false));
  if(document.readyState!=='loading') show(location.hash.slice(1)||names[0],false);
})();
</script>
